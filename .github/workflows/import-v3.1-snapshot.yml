name: Import V3.1 Public Snapshot

on:
  push:
    branches:
      - release/v3.1
    paths:
      - .github/workflows/import-v3.1-snapshot.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/import-v3.1-snapshot.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-v3.1-public-snapshot
  cancel-in-progress: false

jobs:
  import:
    if: github.repository == 'anyue-git/Terminal-AI-Coding-Handbook'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: release/v3.1

      - name: Rebuild and verify audited delta
        shell: bash
        env:
          DELTA_SHA256: "a5878762c0cc46ce3d98c0d6b8ab8b1f5b6931c4bee3d3f2c60e6c4cbc45c15c"
        run: |
          set -euo pipefail
          test "$(find .release-import/v3.1 -maxdepth 1 -type f -name 'part*' | wc -l | tr -d ' ')" = "8"
          cat .release-import/v3.1/part* | base64 --decode --ignore-garbage > /tmp/v3.1-delta.zip
          printf '%s  %s\n' "$DELTA_SHA256" /tmp/v3.1-delta.zip | sha256sum --check --strict
          unzip -t /tmp/v3.1-delta.zip

      - name: Apply audited V3.1 delta
        shell: bash
        run: |
          set -euo pipefail
          unzip -q -o /tmp/v3.1-delta.zip -d .
          rm -rf .release-import
          rm -f .github/workflows/import-v3.1-snapshot.yml
          rm -f Appendix/自动检查报告.md

      - name: Validate release identity
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          test -s SUMMARY.md
          test -s LICENSE
          test -s RELEASE_NOTES_V3.1.md
          test -s .github/release.json
          test ! -e .release-import
          test ! -e .github/workflows/import-v3.1-snapshot.yml
          test ! -e Appendix/自动检查报告.md
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('.github/release.json').read_text(encoding='utf-8'))
          expected = {
              'tag': 'v3.1',
              'name': 'V3.1 — Grok Build 功能体系补充',
              'notes_file': 'RELEASE_NOTES_V3.1.md',
              'target': 'main',
              'prerelease': False,
          }
          if manifest != expected:
              raise SystemExit(f'unexpected release manifest: {manifest!r}')
          PY

      - name: Run public repository checks
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/export_public.sh
          python3 -m py_compile \
            scripts/check_markdown.py \
            scripts/audit_prose_structure.py \
            scripts/audit_formulaic_style.py \
            scripts/audit_sensitive_patterns.py \
            scripts/audit_external_links.py \
            scripts/test_audit_tools.py
          python3 scripts/test_audit_tools.py
          python3 scripts/check_markdown.py --strict-warnings

      - name: Commit audited V3.1 snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'anyue-git'
          git config user.email '192072042+anyue-git@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Public snapshot already matches the release branch.'
            exit 0
          fi
          git commit -m '发布 V3.1 公共快照'
          git push origin HEAD:release/v3.1
