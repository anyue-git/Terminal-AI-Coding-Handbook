name: Import V3 Public Snapshot

on:
  push:
    branches:
      - release/v3.0
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  import-snapshot:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Download validated public snapshot
        shell: bash
        env:
          SNAPSHOT_URL: "https://sdmntprwestus2.oaiusercontent.com/files/00000000-6954-81f8-8014-9af37aecd773/raw?se=2026-07-30T11:54:47Z&sp=r&sv=2026-02-06&sr=b&scid=20765ed0-f094-5e40-81d7-c6385ecc5daa&skoid=c69179d1-5b5d-430f-afa3-b9bdcf9d6497&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-29T23:25:45Z&ske=2026-07-31T23:25:45Z&sks=b&skv=2026-02-06&sig=jja/5Dt3Y9LDh/ynH8g70A6sMwibOvawFUl9YlyRL0U%3D"
        run: |
          curl --fail --location --retry 2 \
            --output "$RUNNER_TEMP/public-snapshot.zip" \
            "$SNAPSHOT_URL"
          mkdir -p "$RUNNER_TEMP/public-snapshot"
          unzip -q "$RUNNER_TEMP/public-snapshot.zip" \
            -d "$RUNNER_TEMP/public-snapshot"

      - name: Verify and apply snapshot
        shell: bash
        run: |
          snapshot="$RUNNER_TEMP/public-snapshot"
          test -f "$snapshot/README.md"
          test -f "$snapshot/SUMMARY.md"
          test -f "$snapshot/LICENSE"
          test -f "$snapshot/.github/workflows/markdown-check.yml"
          test ! -e "$snapshot/.github/workflows/source-release-audit.yml"
          test ! -e "$snapshot/Private"
          test ! -e "$snapshot/Drafts"
          test ! -e "$snapshot/Internal"

          rm -rf "$snapshot/.git"
          rsync -a --delete \
            --exclude='/.git' \
            --exclude='/.git/' \
            "$snapshot/" ./

          git add -A
          python3 scripts/check_markdown.py --strict-warnings
          python3 scripts/test_audit_tools.py

      - name: Commit V3 public snapshot
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '发布 V3.0 公开快照'
          git push origin HEAD:release/v3.0
