name: Finalize public V2 status

on:
  push:
    branches:
      - agent/finalize-public-v2-status

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: agent/finalize-public-v2-status
          fetch-depth: 0

      - name: Update public release status
        run: |
          python3 - <<'PY'
          from pathlib import Path

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          old = '下一步是将经过审查的 V2.0 内容作为正常升级提交同步到现有公共仓库，保留 V1.0 提交历史，并创建 V2.0 标签与发布说明。许可证尚未由作者明确选择，因此当前不会自动加入许可证文件。'
          new = 'V2.0 已作为正常升级提交发布到当前公共仓库，V1.0 提交历史继续保留，并已创建 `v2.0.0` 标签与 GitHub Release。许可证尚未由作者明确选择，因此当前没有自动加入许可证文件。'
          if old not in text:
              raise SystemExit('README target text not found')
          readme.write_text(text.replace(old, new), encoding='utf-8')

          roadmap = Path('ROADMAP.md')
          text = roadmap.read_text(encoding='utf-8')
          replacements = {
              '下一阶段是将经过审查的 V2.0 内容升级到现有公共仓库，同时保留 V1.0 的提交历史。': 'V2.0 已升级到现有公共仓库，并保留 V1.0 的提交历史。',
              '### 第七阶段：合并与公共升级——进行中': '### 第七阶段：合并与公共升级——已完成',
              '- 正在修正合并后的状态文字并准备 V2.0 发布说明；\n- 计划将现有公共 V1.0 仓库升级为 V2.0，同时保留原有提交历史；\n- 不重写公共仓库历史，不覆盖或删除 V1.0 提交记录。': '- 已修正合并后的状态文字并生成 V2.0 发布说明；\n- 已将现有公共 V1.0 仓库升级为 V2.0，同时保留原有提交历史；\n- 已创建 `v2.0.0` 标签与 GitHub Release；\n- 未重写公共仓库历史，也未覆盖或删除 V1.0 提交记录。',
              '当前状态：V2.0 已合并到私有源仓库 `main`，正在准备升级现有公共仓库。': '当前状态：V2.0 已合并到私有源仓库 `main`，并已升级到现有公共仓库；V1.0 历史、`v2.0.0` 标签和发布说明均已保留。',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'ROADMAP target text not found: {old}')
              text = text.replace(old, new)
          roadmap.write_text(text, encoding='utf-8')
          PY
          rm -f .github/workflows/finalize-public-v2-status.yml

      - name: Commit final public status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "更新 V2.0 公开发布状态"
          git push origin HEAD:agent/finalize-public-v2-status
